[workspace]
resolver = "2"
members = [
    "crates/ui",
    "crates/engine-link",
    "crates/shell",
    "bin/isonomic-desktop",
    "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

[workspace.dependencies]
ui = { path = "crates/ui", package = "desktop-ui" }
engine-link = { path = "crates/engine-link" }
shell = { path = "crates/shell" }
# The SDK is a sibling checkout (../isonomic-sdk). CI checks it out at the
# commit in SDK_REF.
isonomic-client = { path = "../isonomic-sdk/crates/client" }
isonomic-proto = { path = "../isonomic-sdk/crates/proto" }
isonomic-testkit = { path = "../isonomic-sdk/crates/testkit" }
# The app platform: the trait every first-party app crate implements.
isonomic-app = { path = "../isonomic-sdk/crates/app" }
# The SDK's smallest app, mounted by the shell's tests until Chat lands.
hello-app = { path = "../isonomic-sdk/examples/hello-app" }
# Isonomic Chat is a sibling checkout (../isonomic-chat), pinned to the
# commit in CHAT_REF.
isonomic-chat = { path = "../isonomic-chat/crates/chat" }
# Isonomic UI is a sibling checkout too, pinned to the commit in UI_REF.
isonomic-ui = { path = "../isonomic-ui/crates/ui" }
futures = "0.3"
libc = "0.2"
# Menu bar status item on macOS. Pinned exactly: it drives native APIs.
tray-icon = { version = "=0.26.1", default-features = false }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "macros"] }

# Isonomic UI's copy of GPUI's macros, which resolve GPUI paths through
# Isonomic UI. The UI, SDK and Chat workspaces apply the same patch; Chat's
# extra components need it.
[patch.crates-io]
gpui-pre-macros = { path = "../isonomic-ui/vendor/gpui-pre-macros" }
