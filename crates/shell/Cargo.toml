[package]
name = "shell"
description = "The window: left rail, tab host, Home tab, menu bar icon and lifecycle"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
publish.workspace = true

[dependencies]
isonomic-app.workspace = true
reports.workspace = true
serde_json.workspace = true
isonomic-client.workspace = true
isonomic-proto.workspace = true
tokio.workspace = true
ui.workspace = true
futures.workspace = true
device3d.workspace = true
# A drawn frame handed to the interface library as an image.
image.workspace = true

# GPUI has no API for a menu bar status item; this crate owns one on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon.workspace = true
# The system's sound player, for the mark's sound in onboarding.
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[dev-dependencies]
ui = { workspace = true, features = ["test-support"] }
isonomic-testkit.workspace = true
hello-app.workspace = true
isonomic-app = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
