[package]
name = "desktop-ui"
description = "The single re-export of the component library. Nothing else in this repo names GPUI or Isonomic UI."
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
publish.workspace = true

[features]
# Headless windows and input simulation for UI tests.
test-support = ["isonomic-app/test-support"]

[dependencies]
# `extra`: Isonomic UI's extra components, such as the wordmark.
isonomic-app = { workspace = true, features = ["extra"] }
